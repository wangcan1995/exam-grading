# Nginx 生产配置: 托管前端 + 反代后端 API + HTTPS
# 部署前替换 your-domain.com 为实际域名(或用服务器IP)

# ----- HTTP → HTTPS 跳转 (配置证书后取消注释) -----
# server {
#     listen 80;
#     server_name your-domain.com;
#     return 301 https://$host$request_uri;
# }

server {
    # ----- HTTPS (配置证书后取消注释这两行，并注释掉下面的 listen 80) -----
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;

    listen 80;
    server_name _;       # 允许任意域名/IP访问; 有域名后改成 your-domain.com

    # 上传文件体积限制 (扫描件可能较大)
    client_max_body_size 20m;

    # ---------- 后端 API 反代 ----------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 判分可能耗时，延长超时
        proxy_read_timeout 120s;
    }

    # ---------- 健康检查 ----------
    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # ---------- 前端静态资源 ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA 路由: 前端路由刷新回退到 index.html
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存 (Vite 构建带 hash，可长期缓存)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
