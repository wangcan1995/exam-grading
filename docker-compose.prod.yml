# 生产环境部署配置
# 启动: docker compose -f docker-compose.prod.yml up -d
#
# 与 docker-compose.yml(开发版) 的区别:
# - 前端构建成静态文件，由 nginx 直接托管(不跑 node)
# - nginx 同时承担: 托管前端 + 反代后端API + HTTPS终结
# - 数据用 named volume 持久化，重装/升级不丢数据
# - 后端多 worker，关闭 debug

services:
  backend:
    build: .
    container_name: exam-backend
    restart: always
    env_file: .env.prod
    volumes:
      # 数据库 + 图片用持久化卷，容器重建不丢
      - backend_data:/app/storage
      - backend_db:/app/data
    expose:
      - "8000"          # 仅容器内可见，由 nginx 反代，不直接对外
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: exam-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"        # HTTPS (配置证书后启用)
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro      # 前端构建产物
      - ./deploy/certs:/etc/nginx/certs:ro             # HTTPS 证书
    depends_on:
      - backend

volumes:
  backend_data:     # 图片存储 (生产建议改挂 COS,见部署文档)
  backend_db:       # 数据库文件
